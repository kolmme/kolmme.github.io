<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbyte y política de privacidad</title>

<style>
  :root { --fondo: #0b0a1a; --texto: #ece8f7; --suave: #a59fc0; --marca: #8b6cf0; --linea: rgba(255,255,255,.1); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--texto); line-height: 1.6;
         background: radial-gradient(1200px 600px at 80% -10%, rgba(139,108,240,.25), transparent 60%), var(--fondo); }
  main { max-width: 720px; margin: 0 auto; padding: 72px 20px; }
  .logo { display: block; width: 96px; height: 96px; border-radius: 24px; margin-bottom: 24px; box-shadow: 0 0 48px rgba(139,108,240,.45); }
  h1 { font-size: 2.4rem; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: var(--suave); }
  .tarjeta { border: 1px solid var(--linea); border-radius: 16px; padding: 20px 22px; margin: 28px 0; background: rgba(255,255,255,.03); }
  a { color: #c4b2ff; }
  footer { margin-top: 48px; font-size: .85rem; color: var(--suave); border-top: 1px solid var(--linea); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Logo de Orbyte" width="96" height="96">

  <footer>Orbyte · proyecto personal de <a href="./">Juan Jose Colmenares</a> · <a href="https://github.com/kolmme">github.com/kolmme</a></footer>
